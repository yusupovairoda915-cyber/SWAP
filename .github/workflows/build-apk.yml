name: Build APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Адрес сервера, например https://api.example.uz"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android
        working-directory: app
        env:
          API_URL: ${{ inputs.api_url }}
        run: bash prepare_android.sh
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_URL=${{ inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: swap-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
